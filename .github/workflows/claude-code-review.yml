name: Claude Auto Review

on:
  pull_request:
    branches: [internal-main]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude')
      )
    uses: hongshancapital/dagon/.github/workflows/claude-auto-review.yml@master
    with:
      user_request: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
